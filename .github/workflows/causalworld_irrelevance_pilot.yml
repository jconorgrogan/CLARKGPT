name: causalworld-irrelevance-pilot
on:
  push:
    branches: [irrelevance-benchmark-ladder]
    paths:
      - 'research/causalworld_irrelevance_pilot.py'
      - '.github/workflows/causalworld_irrelevance_pilot.yml'
  workflow_dispatch:
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install compatible CPU stack
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install 'numpy<1.24' 'scipy<1.11' 'scikit-learn<1.4' 'pandas<2.1'
          pip install 'gym==0.17.3' 'pybullet==3.2.6'
          pip install causal_world
      - name: Run bounded official-simulator pilot
        env:
          OUT: causalworld_results
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/causalworld_irrelevance_pilot.py')
          s = p.read_text()
          block1 = '''        # Vary the foreground robot pose while preserving the goal label.\n        for _ in range(int(rng.randint(0, 3))):\n            env.step(env.action_space.sample())\n'''
          block2 = '''        for _ in range(int(rng.randint(0, 3))):\n            env.step(env.action_space.sample())\n        a = image_tensor(set_color(env, c0))\n'''
          s = s.replace(block1, '')
          s = s.replace(block2, '        a = image_tensor(set_color(env, c0))\n')
          p.write_text(s)
          PY
          # Preserve the same protocol while reducing image and optimization cost.
          sed -i 's/h \/\/ 32/h \/\/ 16/g; s/w \/\/ 32/w \/\/ 16/g; s/:32, :32/:16, :16/g' research/causalworld_irrelevance_pilot.py
          sed -i 's/collect(envs, 800/collect(envs, 500/g; s/collect(envs, 400/collect(envs, 250/g' research/causalworld_irrelevance_pilot.py
          sed -i 's/range(8)/range(4)/g; s/epochs=24/epochs=12/g' research/causalworld_irrelevance_pilot.py
          python research/causalworld_irrelevance_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: causalworld-irrelevance-pilot
          path: causalworld_results/
