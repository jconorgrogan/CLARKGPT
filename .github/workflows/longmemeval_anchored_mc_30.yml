name: longmemeval-v2-anchored-mc-30

on:
  push:
    branches: [irrelevance-benchmark-ladder]
    paths:
      - '.github/workflows/longmemeval_anchored_mc_30.yml'
      - 'research/lme_patch_mc_reader.py'
      - 'research/lme_select_mc_subset.py'
  workflow_dispatch:

jobs:
  score:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        method: [raw, anchored]
        domain: [web, enterprise]
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_XET: '0'
      TOKENIZERS_PARALLELISM: 'false'
      OPENAI_API_KEY: local-dummy-key
      METHOD: ${{ matrix.method }}
      DOMAIN: ${{ matrix.domain }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install huggingface_hub hf_xet scikit-learn scipy pandas

      - name: Install official harness and anchored memory
        run: |
          git clone --depth 1 https://github.com/xiaowu0162/LongMemEval-V2.git lme
          pip install -e ./lme
          cp research/lme_anchored_memory.py lme/memory_modules/distinction_tfidf.py
          printf '\nfrom .distinction_tfidf import DistinctionTfidfMemory  # noqa: E402,F401\n' >> lme/memory_modules/memory.py
          python research/lme_patch_mc_reader.py lme/evaluation/harness.py
          cat > lme/reader_patch.json <<'JSON'
          {
            "experiment": "anchored-mc-30-v1",
            "reader": "Qwen/Qwen3.5-9B Q4_K_M",
            "reasoning": "off",
            "answer_policy": "grammar-constrained one-letter choice A-H",
            "completion_token_cap": 32,
            "format_adapter": "llama.cpp strict JSON schema enum",
            "purpose": "remove reader abstention floor in paired raw-versus-anchored memory test"
          }
          JSON

      - name: Prepare preregistered five-question MC shard
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='xiaowu0162/longmemeval-v2',
              repo_type='dataset',
              local_dir='lme/data/longmemeval-v2',
              allow_patterns=['questions.jsonl','trajectories.jsonl','haystacks/lme_v2_small.json'],
          )
          PY
          python research/lme_select_mc_subset.py \
            --data-root lme/data/longmemeval-v2 \
            --output-root lme/subset_full \
            --per-domain 15 \
            --seed 260832
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          domain = os.environ['DOMAIN']
          shard = int(os.environ['SHARD'])
          method = os.environ['METHOD']
          root = Path('lme/subset_full')
          questions = json.loads((root / f'{domain}_questions.json').read_text())
          haystack = json.loads((root / f'{domain}_haystack.json').read_text())
          start = shard * 5
          selected = questions[start:start + 5]
          if len(selected) != 5:
              raise SystemExit(f'Expected five MC questions for {domain} shard {shard}, found {len(selected)}')
          out = Path('lme/subset_current')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'questions.json').write_text(json.dumps(selected, indent=2) + '\n')
          (out / 'haystack.json').write_text(
              json.dumps({row['id']: haystack[row['id']] for row in selected}, indent=2) + '\n'
          )
          full_manifest = json.loads((root / 'manifest.json').read_text())
          manifest = {
              'experiment': 'anchored-mc-30-v1',
              'selection_seed': 260832,
              'questions_per_domain': 15,
              'questions_per_shard': 5,
              'domain': domain,
              'shard': shard,
              'method': method,
              'question_ids': [row['id'] for row in selected],
              'question_types': [row['question_type'] for row in selected],
              'reader': 'Qwen/Qwen3.5-9B Q4_K_M',
              'memory_context_max_tokens': 4000,
              'chunk_chars': 5000,
              'chunk_overlap': 300,
              'top_k': 20,
              'grammar_choices': list('ABCDEFGH'),
              'selection_manifest': full_manifest['domains'][domain],
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
          mkdir -p lme/configs
          if [ "$METHOD" = 'raw' ]; then MODE=raw; else MODE=anchored_unique; fi
          cat > lme/configs/current.json <<JSON
          {"memory_type":"distinction_tfidf","memory_params":{"mode":"$MODE","chunk_chars":5000,"chunk_overlap":300,"top_k":20}}
          JSON

      - name: Build reader and fetch Qwen3.5-9B Q4_K_M
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -G Ninja -DGGML_NATIVE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --target llama-server -j 4
          hf download tinnlab/Qwen3.5-9B-GGUF Qwen3.5-9B-Q4_K_M.gguf --local-dir qwen9b

      - name: Start deterministic non-thinking reader
        run: |
          nohup ./llama.cpp/build/bin/llama-server \
            -m qwen9b/Qwen3.5-9B-Q4_K_M.gguf \
            --alias Qwen/Qwen3.5-9B \
            --host 127.0.0.1 --port 8023 \
            --ctx-size 8192 --threads 4 --threads-batch 4 --parallel 1 \
            --cache-type-k q8_0 --cache-type-v q8_0 \
            --reasoning off --chat-template-kwargs '{"enable_thinking":false}' \
            --no-warmup > llama-server.log 2>&1 &
          echo $! > llama-server.pid
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8023/health >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat llama-server.pid)" 2>/dev/null; then cat llama-server.log; exit 1; fi
            sleep 3
          done
          cat llama-server.log
          exit 1

      - name: Run paired grammar-constrained MC shard
        working-directory: lme
        run: |
          python evaluation/harness.py \
            --domain "$DOMAIN" \
            --questions-path subset_current/questions.json \
            --haystack-path subset_current/haystack.json \
            --trajectories-path data/longmemeval-v2/trajectories.jsonl \
            --memory-config-path configs/current.json \
            --output-dir "anchoredmc_${METHOD}_${DOMAIN}_${SHARD}" \
            --model Qwen/Qwen3.5-9B \
            --base-url http://127.0.0.1:8023/v1 \
            --api-key-env OPENAI_API_KEY \
            --memory-context-max-tokens 4000 \
            --max-completion-tokens 32 \
            --reader-max-concurrent-requests 1 \
            --prompt-build-max-workers 1 \
            --timeout-seconds 3600 \
            --temperature 0 --top-p 1 \
            --reader-disable-thinking

      - name: Extract auditable compact rows
        working-directory: lme
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          method = os.environ['METHOD']
          domain = os.environ['DOMAIN']
          shard = os.environ['SHARD']
          run = Path(f'anchoredmc_{method}_{domain}_{shard}')
          records = [json.loads(line) for line in (run / 'per_question.jsonl').read_text().splitlines() if line.strip()]
          rows = []
          for record in records:
              meta = record.get('memory_post_query_metadata') or {}
              usage = record.get('usage') or {}
              completion_tokens = int(usage.get('completion_tokens') or 0)
              response = str(record['response_parsed_boxed']).strip().upper()
              rows.append({
                  'experiment': 'anchored-mc-30-v1',
                  'method': method,
                  'domain': domain,
                  'shard': int(shard),
                  'question_id': record['question_id'],
                  'question_type': record['question_type'],
                  'score': float(record['score']),
                  'score_bool': bool(record['score_bool']),
                  'valid_choice': response in set('ABCDEFGH'),
                  'memory_query_seconds': float(record['memory_query_duration_seconds']),
                  'memory_context_tokens': int(record['memory_context_token_count']),
                  'raw_characters': meta.get('raw_characters'),
                  'stored_characters': meta.get('stored_characters'),
                  'storage_ratio': meta.get('storage_ratio'),
                  'completion_tokens': completion_tokens,
                  'hit_completion_cap': completion_tokens >= 32,
                  'response': response,
                  'response_raw': record['response_raw'],
                  'gold': str(record['answer_gold']).strip().upper(),
              })
          frame = pd.DataFrame(rows)
          if len(frame) != 5:
              raise SystemExit(f'Expected five scored rows, found {len(frame)}')
          if not frame['valid_choice'].all():
              raise SystemExit(f'Grammar violation: {frame.loc[~frame.valid_choice, ["question_id", "response"]].to_dict("records")}')
          frame.to_csv(run / 'compact.csv', index=False)
          print(frame.to_string(index=False))
          PY

      - name: Print reader tail
        if: always()
        run: tail -100 llama-server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anchoredmc-${{ matrix.method }}-${{ matrix.domain }}-${{ matrix.shard }}
          path: |
            lme/anchoredmc_${{ matrix.method }}_${{ matrix.domain }}_${{ matrix.shard }}/compact.csv
            lme/anchoredmc_${{ matrix.method }}_${{ matrix.domain }}_${{ matrix.shard }}/aggregated_metrics.json
            lme/anchoredmc_${{ matrix.method }}_${{ matrix.domain }}_${{ matrix.shard }}/per_question.jsonl
            lme/anchoredmc_${{ matrix.method }}_${{ matrix.domain }}_${{ matrix.shard }}/prompt_rows.jsonl
            lme/anchoredmc_${{ matrix.method }}_${{ matrix.domain }}_${{ matrix.shard }}/prompt_build_summary.json
            lme/subset_current/manifest.json
            lme/reader_patch.json
            llama-server.log
