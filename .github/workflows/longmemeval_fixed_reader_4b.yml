name: longmemeval-v2-fixed-reader-4b
on:
  push:
    branches: [irrelevance-benchmark-ladder]
    paths:
      - '.github/workflows/longmemeval_fixed_reader_4b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
          python -m pip install --upgrade pip
          pip install huggingface_hub hf_xet numpy pandas scipy scikit-learn requests
      - name: Build reader and download reproducible Qwen3.5-4B quant
        env:
          HF_HUB_DISABLE_XET: '0'
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --config Release -j2 --target llama-server
          hf download TheStageAI/Qwen3.5-4B-GGUF --include '*M-TS-Q4_K_M.gguf' --local-dir qwen_model
          git clone --depth 1 https://github.com/xiaowu0162/LongMemEval-V2.git lme_official
      - name: Patch non-thinking reader and shard the preregistered 60-question set
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          NUM_SHARDS: '4'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          p=Path('research/longmemeval_fixed_reader_parallel.py')
          s=p.read_text()
          needle='    selected = base.choose_questions(questions, args.limit, args.selection_seed)\n'
          replacement=needle+f'    selected = selected[{int(os.environ["SHARD_INDEX"])}::{int(os.environ["NUM_SHARDS"])}]\n'
          if needle not in s:
              raise SystemExit('selection hook not found')
          p.write_text(s.replace(needle,replacement,1))

          base=Path('research/longmemeval_fixed_reader_local.py')
          b=base.read_text()
          hook='        "top_p": 1,\n'
          if hook not in b:
              raise SystemExit('reader payload hook not found')
          b=b.replace(
              hook,
              hook+'        "reasoning_effort": "none",\n        "chat_template_kwargs": {"enable_thinking": False},\n',
              1,
          )
          base.write_text(b)
          PY
      - name: Start two-slot 4B reader
        run: |
          MODEL_PATH=$(find qwen_model -name '*M-TS-Q4_K_M.gguf' | head -1)
          test -n "$MODEL_PATH"
          nohup ./llama.cpp/build/bin/llama-server \
            -m "$MODEL_PATH" -c 16384 -t 4 -tb 4 -b 1024 -ub 128 \
            --reasoning off --chat-template-kwargs '{"enable_thinking":false}' \
            --host 127.0.0.1 --port 8080 --parallel 2 \
            > llama_server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat llama_server.log
          exit 1
      - name: Run paired 4B shard
        env:
          HF_HUB_DISABLE_XET: '0'
        run: |
          python research/longmemeval_fixed_reader_parallel.py \
            --official-repo lme_official \
            --base-url http://127.0.0.1:8080 \
            --model Qwen3.5-4B-Q4_K_M \
            --limit 60 \
            --context-chars 16000 \
            --workers 2 \
            --out longmemeval_fixed_reader_4b_shard_${{ matrix.shard }}
      - name: Print server log tail
        if: always()
        run: tail -120 llama_server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longmemeval-fixed-reader-4b-shard-${{ matrix.shard }}
          path: |
            longmemeval_fixed_reader_4b_shard_${{ matrix.shard }}/*.csv
            longmemeval_fixed_reader_4b_shard_${{ matrix.shard }}/*.json
            llama_server.log
