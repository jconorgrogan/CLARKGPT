name: longmemeval-v2-state-quotient-context-frontier-9

on:
  push:
    branches: [irrelevance-benchmark-ladder]
    paths:
      - '.github/workflows/longmemeval_state_context_frontier_9.yml'
  workflow_dispatch:

jobs:
  score:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_HUB_DISABLE_XET: '0'
      TOKENIZERS_PARALLELISM: 'false'
      OPENAI_API_KEY: local-dummy-key
      DOMAIN: enterprise
      SHARD: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install huggingface_hub hf_xet scikit-learn scipy pandas

      - name: Install official harness and frozen state quotient
        run: |
          git clone --depth 1 https://github.com/xiaowu0162/LongMemEval-V2.git lme
          pip install -e ./lme
          cp research/lme_incidence_memory.py lme/memory_modules/distinction_graph.py
          printf '\nfrom .distinction_graph import DistinctionGraphMemory  # noqa: E402,F401\n' >> lme/memory_modules/memory.py
          python research/lme_patch_mc_reader.py lme/evaluation/harness.py

          # Symmetry-match the flat raw retriever: score the question stem and
          # every answer option separately using the same aggregation rule as
          # the quotient retriever. This patch affects only the workflow copy.
          python - <<'PY'
          from pathlib import Path

          path = Path('lme/memory_modules/distinction_graph.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if self.mode == "raw":
              if self.raw_matrix is None or not self.raw_texts:
                  return []
              query_vector = self.vectorizer.transform([query])
              scores = (self.raw_matrix @ query_vector.T).toarray().ravel()
              order = np.argsort(-scores, kind="stable")[: self.top_k]
              return [
                  {"type": "text", "value": self.raw_texts[int(index)]}
                  for index in order
                  if self.raw_texts[int(index)].strip()
              ]
          '''
          new = '''        if self.mode == "raw":
              if self.raw_matrix is None or not self.raw_texts:
                  return []
              stem, options = self._query_variants(query)
              variants = [stem] + options if options else [query]
              query_matrix = self.vectorizer.transform(variants)
              scores_all = (self.raw_matrix @ query_matrix.T).toarray()
              scores = self._priority(scores_all)
              order = np.argsort(-scores, kind="stable")[: self.top_k]
              return [
                  {"type": "text", "value": self.raw_texts[int(index)]}
                  for index in order
                  if self.raw_texts[int(index)].strip()
              ]
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one raw-query block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile lme/memory_modules/distinction_graph.py

      - name: Prepare final nine untouched enterprise questions
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='xiaowu0162/longmemeval-v2',
              repo_type='dataset',
              local_dir='lme/data/longmemeval-v2',
              allow_patterns=['questions.jsonl','trajectories.jsonl','haystacks/lme_v2_small.json'],
          )
          PY
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from research.lme_select_mc_holdout import (
              DEVELOPMENT_IDS,
              balanced_select,
              eligible_rows,
              read_jsonl,
          )

          domain = 'enterprise'
          shard = int(os.environ['SHARD'])
          root = Path('lme/data/longmemeval-v2')
          questions = read_jsonl(root / 'questions.jsonl')
          haystacks = json.loads((root / 'haystacks' / 'lme_v2_small.json').read_text())
          eligible = eligible_rows(questions, haystacks, domain)

          prior_holdout = {
              '984022b1', 'cdd0e687', '52dd33bb',
              '58c34839', '73cbefdc', '75816b26',
              'aca57021', 'ecdb7d5e', '756a7434',
          }
          excluded = set(DEVELOPMENT_IDS[domain]) | prior_holdout
          untouched = [row for row in eligible if str(row['id']) not in excluded]
          selected_all = balanced_select(untouched, 9, 260835)
          start = shard * 3
          selected = selected_all[start:start + 3]
          if len(selected) != 3:
              raise SystemExit(f'Expected three frontier questions, found {len(selected)}')
          selected_ids = {str(row['id']) for row in selected}
          if selected_ids & excluded:
              raise SystemExit('Leakage into context-frontier test')
          if len(untouched) != 9:
              raise SystemExit(f'Expected the final nine untouched eligible questions, found {len(untouched)}')

          out = Path('lme/subset_current')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'questions.json').write_text(json.dumps(selected, indent=2) + '\n')
          (out / 'haystack.json').write_text(
              json.dumps({str(row['id']): haystacks[str(row['id'])] for row in selected}, indent=2) + '\n'
          )

          preregistration = {
              'experiment': 'state-quotient-context-frontier-enterprise-9-v1',
              'selection_frozen_before_opening_extension_scores': True,
              'architecture_frozen_from_incidence-heldout-mc-18-v1': True,
              'raw_baseline_repair': 'option-aware query decomposition using identical priority aggregation',
              'primary_comparison': 'state2k versus raw4k',
              'primary_success_rule': (
                  'state2k exact accuracy >= raw4k exact accuracy, '
                  'storage_ratio <= 0.10, and mean reader context <= 0.60 of raw4k'
              ),
              'strong_attention_rule': (
                  'state1k exact accuracy >= raw4k exact accuracy, or '
                  'state2k exact accuracy > raw4k exact accuracy'
              ),
              'secondary_comparisons': [
                  'state4k versus raw4k',
                  'state2k versus raw2k',
                  'state1k versus raw4k',
              ],
              'inference': [
                  'paired exact McNemar tests',
                  'paired bootstrap confidence intervals',
                  'question-level wins and losses',
              ],
              'arms': {
                  'raw4k': {'mode': 'raw', 'context_tokens': 4000},
                  'raw2k': {'mode': 'raw', 'context_tokens': 2000},
                  'state4k': {'mode': 'state_bundle', 'context_tokens': 4000},
                  'state2k': {'mode': 'state_bundle', 'context_tokens': 2000},
                  'state1k': {'mode': 'state_bundle', 'context_tokens': 1000},
              },
              'domain': domain,
              'shard': shard,
              'eligible_count': len(eligible),
              'development_count': len(DEVELOPMENT_IDS[domain]),
              'prior_holdout_count': len(prior_holdout),
              'untouched_count': len(untouched),
              'question_ids': [str(row['id']) for row in selected],
              'question_types': [str(row['question_type']) for row in selected],
              'reader': 'Qwen/Qwen3.5-9B Q4_K_M',
              'completion_tokens': 32,
              'temperature': 0,
          }
          (out / 'manifest.json').write_text(json.dumps(preregistration, indent=2) + '\n')
          print(json.dumps(preregistration, indent=2))
          PY

      - name: Build reader and fetch Qwen3.5-9B Q4_K_M
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -G Ninja -DGGML_NATIVE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --target llama-server -j 4
          hf download tinnlab/Qwen3.5-9B-GGUF Qwen3.5-9B-Q4_K_M.gguf --local-dir qwen9b

      - name: Start deterministic non-thinking reader
        run: |
          nohup ./llama.cpp/build/bin/llama-server \
            -m qwen9b/Qwen3.5-9B-Q4_K_M.gguf \
            --alias Qwen/Qwen3.5-9B \
            --host 127.0.0.1 --port 8023 \
            --ctx-size 8192 --threads 4 --threads-batch 4 --parallel 1 \
            --cache-type-k q8_0 --cache-type-v q8_0 \
            --reasoning off --chat-template-kwargs '{"enable_thinking":false}' \
            --no-warmup > llama-server.log 2>&1 &
          echo $! > llama-server.pid
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8023/health >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat llama-server.pid)" 2>/dev/null; then cat llama-server.log; exit 1; fi
            sleep 3
          done
          cat llama-server.log
          exit 1

      - name: Run five-arm context frontier
        working-directory: lme
        run: |
          set -euo pipefail
          for ARM in raw4k raw2k state4k state2k state1k; do
            case "$ARM" in
              raw4k) MODE=raw; BUDGET=4000 ;;
              raw2k) MODE=raw; BUDGET=2000 ;;
              state4k) MODE=state_bundle; BUDGET=4000 ;;
              state2k) MODE=state_bundle; BUDGET=2000 ;;
              state1k) MODE=state_bundle; BUDGET=1000 ;;
              *) exit 2 ;;
            esac
            mkdir -p configs
            cat > configs/current.json <<JSON
          {"memory_type":"distinction_graph","memory_params":{"mode":"$MODE","chunk_chars":5000,"chunk_overlap":300,"top_k":20,"render_chars":1450,"max_facts_per_bundle":48}}
          JSON
            python evaluation/harness.py \
              --domain "$DOMAIN" \
              --questions-path subset_current/questions.json \
              --haystack-path subset_current/haystack.json \
              --trajectories-path data/longmemeval-v2/trajectories.jsonl \
              --memory-config-path configs/current.json \
              --output-dir "frontier_${ARM}_${DOMAIN}_${SHARD}" \
              --model Qwen/Qwen3.5-9B \
              --base-url http://127.0.0.1:8023/v1 \
              --api-key-env OPENAI_API_KEY \
              --memory-context-max-tokens "$BUDGET" \
              --max-completion-tokens 32 \
              --reader-max-concurrent-requests 1 \
              --prompt-build-max-workers 1 \
              --timeout-seconds 3600 \
              --temperature 0 --top-p 1 \
              --reader-disable-thinking
          done

      - name: Extract and validate all arms
        working-directory: lme
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          domain = os.environ['DOMAIN']
          shard = os.environ['SHARD']
          arms = {
              'raw4k': 4000,
              'raw2k': 2000,
              'state4k': 4000,
              'state2k': 2000,
              'state1k': 1000,
          }
          rows = []
          for arm, budget in arms.items():
              run = Path(f'frontier_{arm}_{domain}_{shard}')
              records = [
                  json.loads(line)
                  for line in (run / 'per_question.jsonl').read_text().splitlines()
                  if line.strip()
              ]
              if len(records) != 3:
                  raise SystemExit(f'{arm}: expected three records, found {len(records)}')
              for record in records:
                  meta = record.get('memory_post_query_metadata') or {}
                  usage = record.get('usage') or {}
                  response = str(record['response_parsed_boxed']).strip().upper()
                  rows.append({
                      'experiment': 'state-quotient-context-frontier-enterprise-9-v1',
                      'arm': arm,
                      'mode': meta.get('mode'),
                      'context_budget': budget,
                      'domain': domain,
                      'shard': int(shard),
                      'question_id': str(record['question_id']),
                      'question_type': record['question_type'],
                      'score': float(record['score']),
                      'score_bool': bool(record['score_bool']),
                      'valid_choice': response in set('ABCDEFGH'),
                      'memory_query_seconds': float(record['memory_query_duration_seconds']),
                      'memory_context_tokens': int(record['memory_context_token_count']),
                      'raw_characters': meta.get('raw_characters'),
                      'stored_characters': meta.get('stored_characters'),
                      'storage_ratio': meta.get('storage_ratio'),
                      'state_count': meta.get('state_count'),
                      'unique_fact_count': meta.get('unique_fact_count'),
                      'incidence_edges': meta.get('incidence_edges'),
                      'returned_items': meta.get('returned_items'),
                      'completion_tokens': int(usage.get('completion_tokens') or 0),
                      'hit_completion_cap': int(usage.get('completion_tokens') or 0) >= 32,
                      'response': response,
                      'response_raw': record['response_raw'],
                      'gold': str(record['answer_gold']).strip().upper(),
                  })
          frame = pd.DataFrame(rows)
          if len(frame) != 15:
              raise SystemExit(f'Expected 15 rows, found {len(frame)}')
          if not frame['valid_choice'].all():
              raise SystemExit('Grammar violation')
          if frame.groupby('arm')['question_id'].nunique().ne(3).any():
              raise SystemExit('Arm pairing failure')
          if frame.pivot(index='question_id', columns='arm', values='gold').nunique(axis=1).ne(1).any():
              raise SystemExit('Gold mismatch across arms')
          frame.to_csv('frontier_compact.csv', index=False)
          print(frame.to_string(index=False))
          PY

      - name: Print reader tail
        if: always()
        run: tail -120 llama-server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-context-frontier-enterprise-${{ matrix.shard }}
          path: |
            lme/frontier_compact.csv
            lme/subset_current/manifest.json
            lme/frontier_*_enterprise_${{ matrix.shard }}/aggregated_metrics.json
            lme/frontier_*_enterprise_${{ matrix.shard }}/per_question.jsonl
            lme/frontier_*_enterprise_${{ matrix.shard }}/prompt_rows.jsonl
            lme/frontier_*_enterprise_${{ matrix.shard }}/prompt_build_summary.json
            llama-server.log
