name: longmemeval-v2-distinction-proxy
on:
  push:
    branches: [irrelevance-benchmark-ladder]
    paths:
      - 'research/longmemeval_v2_distinction_proxy.py'
      - '.github/workflows/longmemeval_v2_distinction_proxy.yml'
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  model_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe GitHub Models fixed reader
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload={"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Return exactly OK"}],"temperature":0,"max_tokens":8}
          req=urllib.request.Request("https://models.github.ai/inference/chat/completions",data=json.dumps(payload).encode(),headers={"Authorization":f"Bearer {os.environ['GITHUB_TOKEN']}","Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=120) as r: out=r.read().decode()
          print(out)
          open("probe.json","w").write(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: longmemeval-reader-probe
          path: probe.json
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sparse retrieval stack
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub hf_xet numpy pandas scipy scikit-learn
      - name: Run official-data compression proxy
        env:
          HF_HUB_DISABLE_XET: '0'
          OUT: longmemeval_proxy_results
        run: python research/longmemeval_v2_distinction_proxy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longmemeval-v2-distinction-proxy
          path: |
            longmemeval_proxy_results/*.csv
            longmemeval_proxy_results/*.json
