name: one-pair-coloredmnist-speed
on:
  push:
    branches: [one-pair-coloredmnist-speed]
  workflow_dispatch:
jobs:
  benchmark:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [0, 1, 2]
        epochs: [1, 2, 4, 8, 18]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy
      - name: Run one-pair learning-curve point
        run: |
          python research/one_pair_coloredmnist.py \
            --seed ${{ matrix.seed }} \
            --epochs ${{ matrix.epochs }} \
            --batch-size 128 \
            --out results
      - uses: actions/upload-artifact@v4
        with:
          name: one-pair-speed-e${{ matrix.epochs }}-s${{ matrix.seed }}
          path: results/
