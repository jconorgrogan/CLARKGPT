name: one-pair-coloredmnist-batch128
on:
  push:
    branches: [one-pair-coloredmnist-batch128]
  workflow_dispatch:
jobs:
  benchmark:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy
      - name: Run exact batch-128 one-pair quotient compiler
        run: |
          python research/one_pair_coloredmnist.py \
            --seed ${{ matrix.seed }} \
            --epochs 18 \
            --batch-size 128 \
            --out results
      - uses: actions/upload-artifact@v4
        with:
          name: one-pair-coloredmnist-b128-seed-${{ matrix.seed }}
          path: results/
