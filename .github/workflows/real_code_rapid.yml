name: real-code-rapid-decision
on:
  push:
    branches: [irrelevance-real-code-rapid]
    paths:
      - 'research/real_code_rapid_decision.py'
      - '.github/workflows/real_code_rapid.yml'
  workflow_dispatch:
jobs:
  benchmark:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - tag: codebert
            model: microsoft/codebert-base
          - tag: contrabert
            model: claudios/ContraBERT_C
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers==4.56.2 pandas numpy safetensors tree_sitter tree_sitter_cpp
      - name: Run rapid decision
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          sed -i "s/df\.transform=='r8'/df['transform']=='r8'/g" research/real_code_rapid_decision.py
          sed -i "s/df\.transform=='base'/df['transform']=='base'/g" research/real_code_rapid_decision.py
          python research/real_code_rapid_decision.py --model '${{ matrix.model }}' --out 'rapid_${{ matrix.tag }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapid-real-code-${{ matrix.tag }}
          path: rapid_${{ matrix.tag }}/
